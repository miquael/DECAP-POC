backend:
  name: github
  # TODO: Replace OWNER/REPOSITORY with the GitHub repository path, for example: example-org/author-site-poc
  repo: OWNER/REPOSITORY
  branch: main

publish_mode: simple
media_folder: public/uploads
public_folder: /uploads

editor:
  preview: false

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home
        file: src/data/pages/home.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Main Headline, name: headline, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Hero Image, name: heroImage, widget: image, required: false }
          - { label: Hero Image Alt Text, name: heroImageAlt, widget: string, required: false }
          - { label: Primary Button Label, name: primaryCtaLabel, widget: string, required: false }
          - { label: Primary Button URL, name: primaryCtaUrl, widget: string, required: false }
          - { label: Body, name: body, widget: markdown, required: false }

      - name: about
        label: About
        file: src/data/pages/about.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Portrait, name: portrait, widget: image, required: false }
          - { label: Portrait Alt Text, name: portraitAlt, widget: string, required: false }
          - { label: Body, name: body, widget: markdown, required: false }

      - name: book
        label: Book
        file: src/data/pages/book.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Book Title, name: bookTitle, widget: string }
          - { label: Subtitle, name: subtitle, widget: string, required: false }
          - { label: Cover Image, name: coverImage, widget: image, required: false }
          - { label: Cover Image Alt Text, name: coverImageAlt, widget: string, required: false }
          - { label: Short Description, name: description, widget: text }
          - { label: Purchase Button Label, name: buyButtonLabel, widget: string, required: false }
          - { label: Purchase URL, name: buyUrl, widget: string, required: false }
          - { label: Body, name: body, widget: markdown, required: false }

      - name: speaking
        label: Speaking / Media
        file: src/data/pages/speaking.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - label: Topics
            name: topics
            widget: list
            required: false
            field: { label: Topic, name: topic, widget: string }
          - { label: Contact Button Label, name: contactCtaLabel, widget: string, required: false }
          - { label: Body, name: body, widget: markdown, required: false }

      - name: contact
        label: Contact
        file: src/data/pages/contact.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Email, name: email, widget: string }
          - { label: Body, name: body, widget: markdown, required: false }

  - name: blog
    label: Blog / Updates
    folder: src/data/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Published Date, name: publishedDate, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Featured Image, name: featuredImage, widget: image, required: false }
      - { label: Featured Image Alt Text, name: featuredImageAlt, widget: string, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
